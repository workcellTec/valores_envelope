<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F2EFE8">
<script>
/* tema antes de desenhar a tela (evita piscar claro→escuro); o app.js cuida das trocas depois */
(function () {
  var t = 'auto'; try { t = localStorage.getItem('painel-tema') || 'auto'; } catch (e) {}
  var d = t === 'escuro' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-tema', d ? 'escuro' : 'claro');
  document.querySelector('meta[name=theme-color]').setAttribute('content', d ? '#0E1013' : '#F2EFE8');
})();
</script>
<meta name="color-scheme" content="light dark">
<title>Painel Vortex</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Painel">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="root"></div>
<div id="sheet"></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript>Este painel precisa de JavaScript.</noscript>
<script type="module" src="app.js"></script>
</body>
</html>
